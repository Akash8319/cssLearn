<!DOCTYPE html>
<html lang="en">
<head>
    <title>Float property </title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        #heading {
            margin-left: 200px;
        }
        #container1 {
            height: 150px;
            width: 600px;
            border: 2px solid black;
            background-color:aqua;
            margin: 5px;
            padding: 20px;

            display: flex;
            justify-content: center;

        }
        #container2 {
            height: 150px;
            width: 600px;
            border: 2px solid black;
            background-color:aqua;
            margin: 5px;
            padding: 20px;

            
            display: flex;
            justify-content: center;
        }
        #container3 {
            height: 150px;
            width: 600px;
            border: 2px solid black;
            background-color:aqua;
            margin: 5px;
            padding: 20px;

            
            display: flex;
            justify-content: center;
        }
        .box{
            width: 100px;
            height: 100px;
            margin: 2.5px;
            border: 2px solid black;
            text-align: center;
            margin: 5px;
        }
        #box1 {
            background-color: red;
            flex-grow: 0;
        }
        #box2 {
            background-color: cadetblue;
            flex-grow: 1;
        }
        #box3 {
            background-color: chocolate;
            flex-grow: 4;
        }
        #box4 {
            background-color: crimson;
            flex-grow: 3;
        }

    </style>
</head>
<body>
    <h1 id="heading">Fleax Container</h1>
    <div id="container1">
        <div id="box1"  class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
        <div id="box4" class="box">Box4</div>

    </div><hr>
    <div id="container2">
        <div id="box1"  class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
        <div id="box4" class="box">Box4</div>

    </div><hr>
    <div id="container3">
        <div id="box1"  class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
        <div id="box4" class="box">Box4</div>

    </div>
</body>
</html>
