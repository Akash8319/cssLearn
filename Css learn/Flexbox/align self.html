<!DOCTYPE html>
<html lang="en">
<head>
    <title>Float property </title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        #heading {
            margin-left: 200px;
        }
        #container1 {
            height: 450px;
            width: 450px;
            border: 2px solid black;
            background-color:aqua;
            margin: 5px;
            padding: 20px;

            display: flex;
            flex-direction: row;
            justify-content: center;
            /* flex-wrap: wrap; */
            align-items: start;
        }
        #container2 {
            height: 450px;
            width: 450px;
            border: 2px solid black;
            background-color:aqua;
            margin: 5px;
            padding: 20px;

            
            display: flex;
            flex-direction: row;
            justify-content: center;
            /* flex-wrap: wrap; */
            align-content: space-around ;
        }
        #container3 {
            height: 450px;
            width: 450px;
            border: 2px solid black;
            background-color:aqua;
            margin: 5px;
            padding: 20px;

            
            display: flex;
            flex-direction: row;
            justify-content: center;
            /* flex-wrap: wrap; */
            align-content:end;
        }
        .box{
            width: 100px;
            height: 100px;
            margin: 2.5px;
            border: 2px solid black;
            text-align: center;
            margin: 5px;
        }
        #box1 {
            background-color: red;
        }
        #box2 {
            background-color: cadetblue;
            align-self: flex-start;
        }
        #box3 {
            background-color: chocolate;
            align-self: center;
        }
        #box4 {
            background-color: crimson;
            align-self:flex-end;
        }
    </style>
</head>
<body>
    <h1 id="heading">Fleax Container</h1>
    <div id="container1">
        <div id="box1"  class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
    </div><hr>
    <div id="container2">
        <div id="box1"  class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
    </div><hr>
    <div id="container3">
        <div id="box1"  class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
    </div>
</body>
</html>
