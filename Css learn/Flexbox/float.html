<!DOCTYPE html>
<html lang="en">
<head>
    <title>Float property </title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        #container {
            height: 110px;
            width: 300px;
            border: 2px solid black;
            background-color:aqua;
        }
        .box{
            width: 100px;
            height: 100px;
            margin: 2.5px;
            border: 3px solid black;
            text-align: center;
        }
        #box1 {
            background-color: red;
            float: right;
        }
        #box2 {
            background-color: cadetblue;
            float: left;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="box1"  class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
    </div>
</body>
</html>
