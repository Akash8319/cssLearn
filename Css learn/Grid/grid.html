<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Float property</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      #heading {
        margin-left: 200px;
      }
      #container1 {
        height: 420px;
        width: 420px;
        border: 2px solid black;
        background-color: aqua;
        margin: 5px;
        padding: 20px;

        display: grid;
        grid-template-columns: 100px 100px;
        grid-template-rows: 100px 100px;
      }

      .box {
        width: 100px;
        height: 100px;
        margin: 2.5px;
        border: 2px solid black;
        text-align: center;
        margin: 5px;
      }
      #box1 {
        background-color: red;
        grid-column: 1/2;
        grid-row: 1/2;
      }
      #box2 {
        background-color: cadetblue;
        grid-column: 2/2;
        grid-row: 1/2;
      }
      #box3 {
        background-color: chocolate;
        grid-column: 1/2;
        grid-row: 2/2;
      }
      #box4 {
        background-color: crimson;
        grid-column: 2/2;
        grid-row: 2/2;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Fleax Container</h1>
    <div id="container1">
      <div id="box1" class="box">Box1</div>
      <div id="box2" class="box">Box2</div>
      <div id="box3" class="box">Box3</div>
      <div id="box4" class="box">Box4</div>
    </div>
    <hr />

  </body>
</html>
