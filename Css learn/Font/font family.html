<!DOCTYPE html>
<html lang="en">
<head>
    <title>Font family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
        <style>
        /* .box {height: 50px; width:50px ;} */
        #box1 {font-family: cursive;}
        #box2 {font-family: Arial, Helvetica, sans-serif;}
        #box3 {font-family: 'Times New Roman', Times, serif;}
        #box4 {font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;}
        .article {font-family:'Dancing Script';}
        </style>
</head>
<body>
    <div id="box1" class="box">this is my box1</div><br>
    <div id="box2" class="box">this is my box 2</div><br>
    <div id="box3" class="box">this is my box3</div><br>
    <div id="box4" class="box">this is my Box4</div><br><hr>
    <p class="article">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi, amet dicta iusto dolore nihil reiciendis, earum maxime eligendi, nobis temporibus iure doloribus eius corrupti error.</p>
</body>
</html>
