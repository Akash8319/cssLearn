<!DOCTYPE html>
<html lang="en">
<head>
      <title>Animation</title>
      <style>
            .box {
                  width: 100px;
                  height: 100px;
                  background-color: lightblue;
                  border: 2px solid rgba(1, 1, 13, 0.963);
                  border-radius: 5px;
                  position: relative;
                  top: 10px;
                  left: 10px;

                  /* animation-name: fiercest;
                  animation-duration: 2s;
                  animation-timing-function: ease-in-out;
                  animation-delay: 1s;

                  animation-iteration-count: 5;
                  animation-direction: alternate-reverse; */
                  
                  animation: fiercest 2s ease-in-out 1s infinite alternate-reverse;
            }
            
            @keyframes fiercest {
                  0% {left: 10px;}
                  50%{left: 50px;}
                  60%{left: 160px;}
                  100% {left: 200px;}
            }
      </style>
</head>
<body>
      <div class="box">scale</div>
      <div class="box" >scale</div>
      <div class="box">scalex</div>
      <div class="box">scaley</div>
</body>
</html>
