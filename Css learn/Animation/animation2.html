<!DOCTYPE html>
<html lang="en">
<head>
      <title>progress container</title>
      <style>
            .progress-container{
                  width: 90%;
                  height: 25px;
                  background-color: gainsboro;
                  border: 2px solid black;
                  border-radius: 10px ;
                  position: relative;
                  left: 4%;
            }

            .progress-bar{
                  background-color: pink;
                  height: 100%;
                  border-radius: 20px;

                  animation: progress 2s  1;
            }

            @keyframes progress {
                  0% {width: 0%;}
                  90%{width: 95%;}
                  95%{width: 70%;}
                  100% { width: 100%;}
            }
      </style>
</head>
<body>
      <div class="progress-container">
            <div class="progress-bar">
            </div>
      </div>
</body>
