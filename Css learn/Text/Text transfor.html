<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text transfor</title>
        <style>
        /* .box {height: 50px; width:50px ;} */
        #box1 {text-transform: capitalize;}
        #box2 {text-transform: lowercase;}
        #box3 {text-transform: uppercase;}
        #box4 {text-transform: none;}
        </style>
</head>
<body>
    <div id="box1" class="box">this is my box1</div><br>
    <div id="box2" class="box">this is my box 2</div><br>
    <div id="box3" class="box">this is my box3</div><br>
    <div id="box4" class="box">this is my Box4</div><br>
</body>
</html>
