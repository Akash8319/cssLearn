<!DOCTYPE html>
<html lang="en">
  <head>
    <title>PSUEDO CLASSES</title>
    <style>
          .pseudo {
                background-color: lightblue;
                height: 25px;
                width: 100px;
                border: 2px solid rgb(19, 174, 122);
                border-radius: 10px;
          }
          .pseudo:hover {
                background-color: lightgreen;
                height: 30px;
                width: 120px;
                border: 3px solid rgb(161, 21, 21);
          }
          .pseudo:active {
                background-color: orange;
                height: 35px;
                width: 140px;
                border: 4px solid rgb(85, 28, 208);
          }
    </style>
  </head>
  <body>
    <button class="pseudo">Hover Me!</button>
  </body>
</html>
