<!DOCTYPE html>
<html lang="en">
<head>
    <title>Box Model</title>
    <style>
        * {margin: 0; padding: 0;}
        .button {height: 50px; width: 100px;}
        #botton1 {
            border: 5px black solid;
            border-radius: 5px;
            margin: 15px 10px 5px 20px;
            padding: 2px;
            background-color: aquamarine;
        }
        #button2 {
            border: 10px slateblue dashed;
            border-radius: 10px 5px 15px 20px;
            margin: 10px;
            padding: 10px 15px 5px 8px;
            background-color: bisque;
        }
    </style>
</head>
<body>
    <button id="botton1" class="button">Click Me</button>
    <div id="button2" class="button">Click Me</div>
</body>
</html>
