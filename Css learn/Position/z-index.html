<!DOCTYPE html>
<html lang="en">
<head>
    <title>Position</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            text-align: center;
            text-decoration: solid;
            background-color: darksalmon;
            border:5px solid black;
            margin: 20px;

            }
        #box1 {
            position: static;
        }   
        #box2 {
            position: relative;
            top: 20px;
            left: 90px;
            z-index: 1;
        }
        #box3{
            position: fixed;
            top: 25px;
            left: 90px;
            z-index: 3;

        }
        #box4{
            position: absolute;
            top: 200px;
            left: 200px;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">static</div>
    <div id="box2" class="box">relative</div>
    <div id="box3" class="box">fixed</div>
    <div id="box4"  class="box">absolute</div>

</body>
</html>
