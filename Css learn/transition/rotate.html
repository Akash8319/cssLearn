<!DOCTYPE html>
<html lang="en">
<head>
      <title>Transform</title>
      <style>
            .box {
                  width: 100px;
                  height: 100px;
                  background-color: lightblue;
                  border: 2px solid rgba(1, 1, 13, 0.963);
                  border-radius: 5px;
                  position: relative;
                  top: 50px;
                  left: 50px;

                  transition: all 0.5s ease-in;
            }
            .box:hover {
                  transform: rotatex(45deg);
                  background-color: pink;
            }
            /* x and y is axis of rotation */
      </style>
</head>
<body>
      <div class="box">rotate</div>
</body>
</html>
