<!DOCTYPE html>
<html lang="en">
<head>
      <title>Transform</title>
      <style>
            .box {
                  width: 100px;
                  height: 100px;
                  background-color: lightblue;
                  border: 2px solid rgba(1, 1, 13, 0.963);
                  border-radius: 5px;
                  position: relative;
                  top: 50px;
                  left: 50px;

                  transition: all 0.5s ease-in;
            }
            #box1:hover {
                  transform: scale(2);
                  background-color: pink;}

            #box2:hover {
                  transform: scale(3);
                  background-color: rgb(240, 243, 58);      
            }

            #box3:hover {
                  transform: scalex(4);
                  background-color: rgb(42, 86, 111);}

            #box4:hover {
                  transform: scaley(2);
                  background-color: rgb(184, 8, 38);    }  
      </style>
</head>
<body>
      <div class="box" id="box1">scale</div>
      <div class="box" id="box2">scale</div>
      <div class="box" id="box3">scalex</div>
      <div class="box" id="box4">scaley</div>
</body>
</html>
